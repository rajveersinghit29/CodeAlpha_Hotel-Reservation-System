<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login — Aura Hotels</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS (Stitch Design System) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-primary-fixed": "#001b3c",
              "on-primary": "#ffffff",
              "surface-bright": "#f8f9ff",
              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "on-surface-variant": "#43474e",
              "surface-container": "#e5eeff",
              "surface": "#f8f9ff",
              "background": "#f8f9ff",
              "inverse-surface": "#223144",
              "on-primary-fixed-variant": "#2d476f",
              "on-tertiary": "#ffffff",
              "secondary-fixed": "#d2e4ff",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#eaf1ff",
              "on-error": "#ffffff",
              "surface-container-low": "#eff4ff",
              "on-secondary-fixed-variant": "#00497e",
              "tertiary-container": "#003f23",
              "secondary-container": "#66affe",
              "on-secondary-container": "#004172",
              "surface-container-lowest": "#ffffff",
              "on-background": "#0d1c2e",
              "surface-container-high": "#dce9ff",
              "surface-dim": "#ccdbf4",
              "outline-variant": "#c4c6cf",
              "outline": "#74777f",
              "on-surface": "#0d1c2e",
              "secondary-fixed-dim": "#9fcaff",
              "surface-variant": "#d4e4fc",
              "on-primary-container": "#86a0cd",
              "surface-container-highest": "#d4e4fc",
              "primary-fixed-dim": "#adc7f7",
              "tertiary": "#002713",
              "on-tertiary-fixed-variant": "#00522f",
              "on-error-container": "#93000a",
              "tertiary-fixed-dim": "#74db9d",
              "secondary": "#0061a5",
              "on-secondary-fixed": "#001d37",
              "surface-tint": "#455f88",
              "on-tertiary-fixed": "#002110",
              "inverse-primary": "#adc7f7",
              "primary-fixed": "#d6e3ff",
              "primary-container": "#1a365d",
              "tertiary-fixed": "#91f8b8",
              "on-tertiary-container": "#4bb278",
              "primary": "#002045"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "container-max-width": "1280px",
              "gutter": "24px",
              "margin-mobile": "16px",
              "unit": "4px",
              "margin-desktop": "32px"
            },
            "fontFamily": {
              "headline-md": ["Inter"],
              "body-sm": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "headline-lg": ["Inter"],
              "label-caps": ["Inter"],
              "display-metric": ["Inter"]
            },
            "fontSize": {
              "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
              "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
              "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
              "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
              "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
              "display-metric": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css"/>
</head>

<body class="font-body-lg text-on-surface bg-surface-container-lowest h-screen flex flex-col items-center justify-center relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary rounded-full mix-blend-multiply filter blur-[100px] opacity-20"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary rounded-full mix-blend-multiply filter blur-[100px] opacity-20"></div>

    <div class="z-10 w-full max-w-md px-margin-mobile">
        <div class="bg-surface-container-lowest p-8 rounded-2xl border border-outline-variant academic-card shadow-2xl animate-fade-in-up">
            
            <div class="flex flex-col items-center mb-8">
                <div class="flex items-center gap-3 mb-2">
                    <span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings:'FILL' 1;">hotel</span>
                    <h1 class="font-headline-lg text-headline-md font-bold text-primary">Aura Hotels</h1>
                </div>
                <p class="font-body-sm text-on-surface-variant text-center">Sign in to book your premium stay</p>
            </div>

            <form id="login-form" class="flex flex-col gap-5">
                <div class="flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">Full Name</label>
                    <input class="bg-surface-container-lowest border border-outline rounded-lg px-4 py-3 focus:ring-2 focus:ring-secondary focus:outline-none text-body-lg" 
                           id="login-name" placeholder="John Doe" type="text" required/>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">Email Address</label>
                    <input class="bg-surface-container-lowest border border-outline rounded-lg px-4 py-3 focus:ring-2 focus:ring-secondary focus:outline-none text-body-lg" 
                           id="login-email" placeholder="john@example.com" type="email" required/>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">Password</label>
                    <input class="bg-surface-container-lowest border border-outline rounded-lg px-4 py-3 focus:ring-2 focus:ring-secondary focus:outline-none text-body-lg" 
                           id="login-password" placeholder="••••••••" type="password" required/>
                </div>
                
                <button type="submit" id="login-btn" class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-body-lg flex items-center justify-center gap-2 active:scale-95 transition-transform mt-2 hover:opacity-90">
                    <span class="material-symbols-outlined" style="font-size:20px;">login</span>
                    Sign In
                </button>
            </form>
            
            <p class="font-body-sm text-center text-on-surface-variant mt-6">
                (Any credentials will work for this demo)
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
